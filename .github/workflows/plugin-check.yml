name: Plugin Check

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: plugin-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-check:
    name: wordpress.org directory checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Apply the same export-ignore rules used by the installable ZIP.
      - name: Build the release tree
        run: |
          mkdir -p "build/${{ github.event.repository.name }}"
          git archive HEAD | tar -x -C "build/${{ github.event.repository.name }}"

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./build/${{ github.event.repository.name }}
